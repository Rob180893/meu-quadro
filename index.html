<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadro Kanban</title>
<style>
:root{--bg:#e8eef7;--col:#f4f5f7;--card:#fff;--tx:#1d2433;--mut:#6b778c;--ac:#2f6fed;--bd:#d8dde6;--ph:#c7d7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--col:#1b2230;--card:#252e40;--tx:#e8ecf3;--mut:#93a0b8;--ac:#6b98ff;--bd:#33405a;--ph:#2c3d68;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;color:var(--mut);font-size:13px}
#board{flex:1;display:flex;gap:14px;padding:0 20px 20px;overflow-x:auto;align-items:flex-start}
.col{background:var(--col);border-radius:12px;width:290px;flex:none;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--bd)}
.col.dragging{opacity:.4}
.head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px;cursor:grab}
.title{flex:1;font-weight:600;outline:none;border-radius:4px;padding:2px 4px;cursor:text}
.title:focus{background:var(--card);box-shadow:0 0 0 2px var(--ac)}
.count{color:var(--mut);font-size:12px}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;line-height:1;border-radius:4px;padding:2px 6px}
.x:hover{background:var(--bd);color:var(--tx)}
.list{padding:4px 8px;overflow-y:auto;min-height:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:8px;padding:9px 10px;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:grab;display:flex;gap:6px;align-items:flex-start;word-break:break-word}
.card span{flex:1;outline:none}
.card .x{opacity:0}.card:hover .x{opacity:1}
.card.dragging{opacity:.35}
.ph{height:38px;border-radius:8px;background:var(--ph);border:2px dashed var(--ac);flex:none}
.colph{width:290px;flex:none;align-self:stretch;max-height:120px;border-radius:12px;background:var(--ph);border:2px dashed var(--ac)}
.add{padding:8px}
.add input,.newcol input{width:100%;border:1px solid transparent;background:transparent;color:var(--tx);padding:8px;border-radius:8px;font:inherit}
.add input::placeholder,.newcol input::placeholder{color:var(--mut)}
.add input:hover,.newcol input:hover{background:var(--bd)}
.add input:focus,.newcol input:focus{background:var(--card);border-color:var(--ac);outline:none}
.newcol{width:290px;flex:none;background:rgba(127,127,127,.15);border-radius:12px;padding:8px}
.tabs{display:flex;gap:4px;background:rgba(127,127,127,.15);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.18)}
header{flex-wrap:wrap;gap:8px}
#disc{flex:1;overflow:auto;padding:0 20px 20px;display:none}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--col);color:var(--tx);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dchips input,.blk input.ni{border:1px dashed var(--bd);background:transparent;color:var(--tx);padding:6px 10px;border-radius:999px;font:inherit;min-width:0}
.blk input.ni{width:100%;border-radius:8px;margin-top:6px}
.dchips input:focus,.blk input.ni:focus{outline:2px solid var(--ac);background:var(--card)}
.dh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.dh h2{margin:0;font-size:22px;flex:1}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.blk{background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:12px}
.blk h3{margin:0 0 8px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;word-break:break-word}
.row:hover{background:var(--bd)}
.row label{flex:1;display:flex;gap:8px;align-items:center;cursor:pointer}
.row.done label span{text-decoration:line-through;color:var(--mut)}
.row input[type=date]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;font:inherit;font-size:12px;padding:2px 4px}
.sub{color:var(--mut);font-size:12px}
.rev{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap}
.rev .rl{flex:2;min-width:280px}.rev .cal{flex:1;min-width:260px}
.rt{padding:8px 0;border-bottom:1px solid var(--bd)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.pill.ok{background:#2e9e5b;border-color:#2e9e5b;color:#fff}
.pill.late{border-color:#d33;color:#d33;font-weight:600}
.pill.today{border-color:var(--ac);background:var(--ph);font-weight:600}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg b{font-size:11px;color:var(--mut)}
.day{aspect-ratio:1;border:0;background:var(--card);color:var(--tx);border-radius:6px;font:inherit;font-size:12px;cursor:pointer;position:relative;padding:0}
.day.o{background:transparent;cursor:default}
.day.t{outline:2px solid var(--ac)}
.day.s{background:var(--ph)}
.day i{position:absolute;bottom:1px;left:0;right:0;font-style:normal;font-size:10px;color:var(--ac);font-weight:700}
.day i.late{color:#d33}.day i.ok{color:#2e9e5b}
.leg{margin-top:8px;font-size:12px;color:var(--mut)}
.tm{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.tmd{font:700 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.tmb{border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer}
.tmb.on{background:#d33}
.tm .mi{width:92px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 8px;font:inherit}
.tmi{flex:1;min-width:150px}
.tmi small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
#tms{color:var(--mut);font-size:13px;margin-top:6px}
#cmp{flex:1;overflow:auto;padding:0 20px 20px;display:none}
.cmpsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.sm{background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:12px}
.sm small{color:var(--mut);font-size:12px}
.sm div{font-size:22px;font-weight:700;margin-top:2px;word-break:break-word}
.br{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;margin:9px 0}
.br .tr{height:22px;background:var(--card);border-radius:6px;overflow:hidden}
.br .fl{height:100%;border-radius:6px;transition:width .3s}
.br .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .v{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
table.ct{border-collapse:collapse;width:100%;font-size:13px}
.ct th,.ct td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
.ct th:first-child,.ct td:first-child{text-align:left}
.ct th{color:var(--mut);font-weight:600}
:root[data-theme="dark"]{--bg:#10151f;--col:#1b2230;--card:#252e40;--tx:#e8ecf3;--mut:#93a0b8;--ac:#6b98ff;--bd:#33405a;--ph:#2c3d68;color-scheme:dark}
.th{border:0;background:rgba(127,127,127,.15);color:var(--tx);font-size:18px;line-height:1;border-radius:10px;padding:7px 12px;cursor:pointer}
.th:hover{background:rgba(127,127,127,.3)}
#rem{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100vw - 32px);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:50;overflow:hidden}
.rh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;font-weight:600}
.rh>span:first-child{flex:1}
.rb{background:#d33;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;min-width:22px;text-align:center}
.rb.z{background:#2e9e5b}
.rbody{max-height:40vh;overflow:auto;padding:0 10px 10px}
.rbody .row{align-items:flex-start}
.rtx{flex:1;cursor:pointer;font-size:14px}
#cyc{flex:1;overflow:auto;padding:0 20px 20px;display:none}
.tmb.s{padding:5px 10px;font-size:13px}
.cyr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;margin-bottom:6px}
.cyr.cur{background:var(--ph);border-color:var(--ac)}
.cyr.dn .cyn{color:var(--mut)}
.cyl{flex:1;min-width:0}
.cyn{font-weight:600;word-break:break-word}
.cyl .tr{height:10px;background:var(--card);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.cyl .fl{height:100%;background:var(--ac);border-radius:6px;transition:width .3s}
.cyr.dn .fl{background:#2e9e5b}
.cya{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cya input,.cyadd input,.cyadd select{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 7px;font:inherit;font-size:13px}
.cya input{width:66px}
.cyadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.cyadd input{width:96px}
@media(max-width:560px){.cyr{flex-direction:column;align-items:stretch}.cya{justify-content:flex-start}}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;flex:1;min-width:0;scrollbar-width:thin}
.car .cyr{flex:0 0 250px;flex-direction:column;align-items:stretch;scroll-snap-align:center;background:var(--card);border:1px solid var(--bd);margin:0;padding:14px;border-radius:14px;gap:12px}
.car .cyr.cur{background:var(--ph);border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.car .cyn{font-size:16px}
.car .cya{justify-content:flex-start}
.carw{display:flex;align-items:center;gap:6px}
.carb{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
.carb:hover{background:var(--bd)}
.ovb{display:flex;gap:4px;margin-bottom:14px}
.ovs{position:relative;height:28px;background:var(--col);border:1px solid var(--bd);border-radius:7px;overflow:hidden;min-width:0}
.ovf{position:absolute;top:0;bottom:0;left:0;background:var(--ac);opacity:.5}
.ovs span{position:absolute;inset:0;padding:5px 8px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{max-height:none}
.list{overflow-y:visible}
#bbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 20px 12px}
#bbar input{border:1px dashed var(--bd);background:transparent;color:var(--tx);padding:6px 10px;border-radius:999px;font:inherit;min-width:0}
#bbar input:focus{outline:2px solid var(--ac);background:var(--card)}
.ringbox{background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:14px}
.cyadd input[type=number]{width:70px}
.dh h2[contenteditable=true]{outline:2px solid var(--ac);border-radius:6px;padding:0 6px;background:var(--card)}
.dh .x{font-size:14px}
.cyh{cursor:grab;font-size:12px;color:var(--mut);padding:2px 0;user-select:none}
.cyh:active{cursor:grabbing}
.cyr.dov{outline:2px dashed var(--ac)}
#usr{display:flex;align-items:center;gap:8px;font-size:13px}
#usr img{border-radius:50%}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.lcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px;max-width:380px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.lt{font-size:22px;font-weight:700;margin-bottom:8px}
#lerr{color:#d33;margin-top:10px;font-size:13px}
:root{--grad:linear-gradient(135deg,#e6f1ff 0%,#bfdcff 50%,#8dbcff 100%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--grad:linear-gradient(135deg,#081428 0%,#0f2757 50%,#0e3f7d 100%)}}
:root[data-theme="dark"]{--grad:linear-gradient(135deg,#081428 0%,#0f2757 50%,#0e3f7d 100%)}
html{background:var(--bg)}
body{background:var(--grad);background-attachment:fixed}
#login{background:var(--grad)}
header>span,.tab,.title,#bbar .chip,.dchips .chip,.dh h2,.blk h3,.cyn,.br .n,.rh>span:first-child,.ch,.lt{text-transform:uppercase}
header>span,.tab,.title,.dh h2{letter-spacing:.04em}
.grip{cursor:grab;color:var(--mut);user-select:none;padding:0 2px;font-size:16px;line-height:1}
.grip:active{cursor:grabbing}
@media(hover:none){.card .x{opacity:1}}
html{background:var(--grad);background-attachment:fixed;background-color:var(--bg);touch-action:manipulation}
body{background:transparent}
@supports(height:100dvh){html,body{height:100dvh}}
.dh h2[contenteditable=true]{outline:none;background:transparent;padding:0;cursor:text}
.dh h2:focus{outline:2px solid var(--ac);border-radius:6px;padding:0 6px;background:var(--card)}
.mv{display:none}
@media(hover:none){.mv{display:inline-block}}
@media(max-width:640px){
 header{padding:10px 12px;gap:6px}
 header>span{font-size:15px}
 .tabs{order:3;width:100%;overflow-x:auto}
 .tab{flex:1;white-space:nowrap;padding:7px 8px;font-size:13px}
 #usr{margin-left:auto}#unm{display:none}
 #bbar{padding:0 12px 10px}
 #board{padding:0 12px 16px;scroll-snap-type:x mandatory;gap:10px}
 .col,.newcol{width:84vw;max-width:340px;scroll-snap-align:center}
 #disc,#cmp,#cyc{padding:0 12px 16px}
 .dgrid{grid-template-columns:1fr}
 .rev .rl,.rev .cal{flex:1 1 100%;min-width:0}
 .tmd{font-size:28px}
 .tm{padding:10px}
 .br{grid-template-columns:80px 1fr auto;gap:8px}
 #rem{right:12px;left:12px;width:auto;max-width:none}
 input,select{font-size:16px!important}
 .ringbox{padding:4px}
 .dh{flex-wrap:wrap}.dh h2{font-size:18px;min-width:60%}
}
.today{border-left:4px solid var(--ac);background:var(--col)}
.today .row{background:var(--card);margin-bottom:6px;border-radius:8px;padding:8px 10px}
.today .row label{align-items:flex-start}
.tmb.ok{background:#2e9e5b}
.tmb.cn{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tm{row-gap:10px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:60}
#rem{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#foc{position:fixed;inset:0;z-index:90;background:rgba(6,12,28,.95);color:#fff;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.fbox{width:100%;max-width:640px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative;padding-top:20px}
.fx{position:absolute;top:-6px;right:0;color:#fff!important;font-size:22px!important}
.fbox select,.fbox input{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 10px;font:inherit}
.fbox option{color:#111}
.fbox .sub{color:#b8c4dc}
.fbig{font:700 clamp(52px,15vw,116px)/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.fcirc{width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:#111;font-size:26px;cursor:pointer}
.fcirc.ok{background:#2e9e5b;color:#fff}.fcirc:disabled{opacity:.35;cursor:default}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.gbar{width:100%;height:12px;background:rgba(127,127,127,.25);border-radius:8px;overflow:hidden}
.gfill{height:100%;background:var(--ac);border-radius:8px;transition:width .3s}
.gsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.gs{background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.gs b{display:block;font-size:24px;color:var(--ac)}
.gs small,.gr small{color:var(--mut);font-size:12px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.gc{background:var(--col);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:12px;cursor:pointer}
.gc:hover{box-shadow:0 4px 14px rgba(0,0,0,.2)}
.gt{font-weight:700;margin-bottom:8px;text-transform:uppercase;font-size:14px;word-break:break-word}
.gr{display:flex;justify-content:space-between;text-align:center;gap:6px}
.gr b{display:block;font-size:20px}
.bdg{display:inline-block;min-width:34px;padding:1px 6px;border-radius:5px;font-weight:700;font-size:12px;color:#fff;text-align:center}
.bdg.g{background:#2e9e5b}.bdg.y{background:#e0a000}.bdg.r{background:#d33}.bdg.z{background:var(--mut)}
.ct input.nm{width:56px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:3px 4px;font:inherit;font-size:13px;text-align:center}
.ct input[type=date],.ct input.lk{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:2px 4px;font:inherit;font-size:12px}
.ct input.lk{width:130px}
.ct td.tn{text-align:left;white-space:normal;min-width:170px}
.ct tr.dn td{background:rgba(46,158,91,.13)}
.ct a{color:var(--ac)}
body{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1;grid-row:1/3;flex-direction:column;align-items:stretch;flex-wrap:nowrap;justify-content:flex-start;gap:6px;padding:18px 12px;background:var(--col);border-right:1px solid var(--bd);overflow-y:auto;height:100%}
header>span{font-size:16px;margin-bottom:10px;line-height:1.2}
.tabs{flex-direction:column;background:transparent;padding:0;gap:4px;order:0;width:100%;overflow:visible}
.tab{text-align:left;padding:10px 12px;font-size:14px;width:100%;flex:none;white-space:nowrap}
#tq::before{content:'📋 '}#td::before{content:'📚 '}#tc::before{content:'📊 '}#tcy::before{content:'🔄 '}
.th{margin-top:auto;align-self:flex-start}
#usr{flex-wrap:wrap;margin-top:8px;margin-left:0}
#unm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bbar{grid-column:2;grid-row:1;padding:16px 20px 12px}
#board,#disc,#cmp,#cyc{grid-column:2;grid-row:2;min-height:0;min-width:0}
#disc,#cmp,#cyc{padding-top:18px}
@media(max-width:640px){
 body{grid-template-columns:56px minmax(0,1fr)}
 header{padding:12px 6px;align-items:center}
 header>span{font-size:0;margin:0}
 header>span::before{content:'📋';font-size:22px}
 .tabs{width:100%}
 .tab{font-size:0;padding:10px 0;text-align:center}
 .tab::before{font-size:20px}
 .th{align-self:center}
 #usr{flex-direction:column;gap:4px;align-items:center}
 #unm,#syn{display:none}
 #lout{font-size:11px}
 #bbar{padding:12px 12px 10px}
 .col,.newcol{width:calc(100vw - 100px)}
 #disc,#cmp,#cyc{padding-left:12px;padding-right:12px}
}

const KEY='kanban-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
let cols=[
 {id:uid(),title:'A fazer',cards:[{id:uid(),text:'Pesquisar referências'},{id:uid(),text:'Definir escopo do projeto'},{id:uid(),text:'Montar cronograma'}]},
 {id:uid(),title:'Em andamento',cards:[{id:uid(),text:'Desenhar telas'}]},
 {id:uid(),title:'Concluído',cards:[{id:uid(),text:'Reunião de kickoff'}]}
];
let BR={list:[{id:uid(),name:'Quadro 1',cols}],sel:null};
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(Array.isArray(p))BR.list[0].cols=p;else if(p&&p.list&&p.list.length)BR=p}}catch(e){}
if(!BR.list.some(b=>b.id===BR.sel))BR.sel=BR.list[0].id;

cols=curB().cols;
const MAXB=8,bbar=document.getElementById('bbar');
const save=()=>{try{curB().cols=cols;localStorage.setItem(KEY,JSON.stringify(BR))}catch(e){}push()};
function renderBar(){
  bbar.innerHTML='';
  BR.list.forEach(b=>{
    const c=el('button','chip'+(b.id===BR.sel?' on':''),b.name);
    c.title='Clique no quadro selecionado para renomear';
    c.onclick=()=>{if(b.id!==BR.sel){save();BR.sel=b.id;cols=b.cols;save();renderBar();render()}else rn()};
    const rn=()=>{const i=el('input');i.value=b.name;c.replaceWith(i);i.focus();i.select();i.onblur=()=>{if(i.value.trim())b.name=i.value.trim();save();renderBar()};i.onkeydown=e=>{if(e.key==='Enter')i.blur()}};
    bbar.append(c);
  });
  if(BR.list.length<MAXB){
    const ni=el('input');ni.placeholder='+ Novo quadro';
    ni.onkeydown=e=>{if(e.key==='Enter'){save();const nb={id:uid(),name:ni.value.trim()||'Quadro '+(BR.list.length+1),cols:[{id:uid(),title:'A fazer',cards:[]},{id:uid(),title:'Em andamento',cards:[]},{id:uid(),title:'Concluído',cards:[]}]};BR.list.push(nb);BR.sel=nb.id;cols=nb.cols;save();renderBar();render()}};
    bbar.append(ni);
  }
  bbar.append(el('span','sub',BR.list.length+'/'+MAXB+' quadros'));
  if(BR.list.length>1){
    const dx=el('button','x','Excluir quadro');
    dx.onclick=()=>ask(dx,()=>{BR.list=BR.list.filter(b=>b.id!==BR.sel);BR.sel=BR.list[0].id;cols=curB().cols;save();renderBar();render()});
    bbar.append(dx);
  }
}
const board=document.getElementById('board');
let drag=null, phEl=null;

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function clearPh(){if(phEl){phEl.remove();phEl=null}}

function cardEl(col,card){
  const c=el('div','card');c.draggable=true;
  const t=el('span',null,card.text);
  const x=el('button','x','×');x.title='Excluir';
  x.onclick=()=>{col.cards=col.cards.filter(k=>k.id!==card.id);save();render()};
  t.ondblclick=()=>{c.draggable=false;t.contentEditable='true';t.focus()};
  t.onblur=()=>{t.contentEditable='false';c.draggable=true;const v=t.textContent.trim();if(v){card.text=v;save()}else t.textContent=card.text};
  t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}};
  c.ondragstart=e=>{e.stopPropagation();drag={t:'card',id:card.id};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.id);setTimeout(()=>c.classList.add('dragging'),0)};
  c.ondragend=()=>{drag=null;clearPh();render()};
  const ed=el('button','x','✎');ed.title='Editar cartão';ed.onclick=()=>{c.draggable=false;t.contentEditable='true';t.focus()};
  const mvb=(d,l)=>{const b=el('button','x mv',l);b.title=d<0?'Mover para a coluna anterior':'Mover para a próxima coluna';b.onclick=()=>{const i=cols.indexOf(col),j=i+d;if(j<0||j>=cols.length)return;col.cards=col.cards.filter(k=>k!==card);cols[j].cards.push(card);save();render()};return b};
  c.append(t,mvb(-1,'‹'),mvb(1,'›'),ed,x);return c;
}

function colEl(col){
  const w=el('div','col');w.dataset.id=col.id;
  const h=el('div','head');const gp=el('span','grip','⠿');gp.title='Arraste para mover a coluna';gp.draggable=true;
  const t=el('div','title',col.title);
  t.contentEditable='true';t.spellcheck=false;t.title='Clique para editar o nome';
  t.onblur=()=>{const v=t.textContent.trim();if(v){col.title=v;save()}else t.textContent=col.title};
  t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}};
  const n=el('span','count',col.cards.length);
  const x=el('button','x','×');x.title='Excluir coluna';
  x.onclick=()=>{const go=()=>{cols=cols.filter(c=>c!==col);save();render()};if(!col.cards.length)go();else ask(x,go)};
  h.append(gp,t,n,x);
  gp.ondragstart=e=>{drag={t:'col',id:col.id};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',col.id);e.dataTransfer.setDragImage(w,20,20);setTimeout(()=>w.classList.add('dragging'),0)};
  gp.ondragend=()=>{drag=null;clearPh();render()};

  const list=el('div','list');
  col.cards.forEach(k=>list.append(cardEl(col,k)));
  list.ondragover=e=>{
    if(!drag||drag.t!=='card')return;
    e.preventDefault();e.stopPropagation();
    const items=[...list.querySelectorAll('.card:not(.dragging)')];
    const after=items.find(i=>{const r=i.getBoundingClientRect();return e.clientY<r.top+r.height/2});
    if(!phEl)phEl=el('div','ph');
    if(after)list.insertBefore(phEl,after);else list.append(phEl);
  };
  list.ondrop=e=>{
    if(!drag||drag.t!=='card'||!phEl)return;
    e.preventDefault();e.stopPropagation();
    const idx=[...list.children].filter(c=>c.classList.contains('card')&&!c.classList.contains('dragging')&&c.compareDocumentPosition(phEl)&Node.DOCUMENT_POSITION_FOLLOWING).length;
    let moved;
    cols.forEach(c=>{const i=c.cards.findIndex(k=>k.id===drag.id);if(i>-1)moved=c.cards.splice(i,1)[0]});
    if(moved){col.cards.splice(idx,0,moved);save()}
    drag=null;clearPh();render();
  };

  const add=el('div','add');
  const inp=el('input');inp.placeholder='+ Adicionar cartão';
  inp.onpaste=e=>{const t=(e.clipboardData||window.clipboardData).getData('text');const ls=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(ls.length>1){e.preventDefault();ls.forEach(s=>col.cards.push({id:uid(),text:s}));save();render()}};
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){col.cards.push({id:uid(),text:inp.value.trim()});save();render();const ni=board.querySelector(`[data-id="${col.id}"] .add input`);ni&&ni.focus()}};
  add.append(inp);
  w.append(h,list,add);return w;
}

board.ondragover=e=>{
  if(!drag||drag.t!=='col')return;
  e.preventDefault();
  const items=[...board.querySelectorAll('.col:not(.dragging)')];
  const after=items.find(i=>{const r=i.getBoundingClientRect();return e.clientX<r.left+r.width/2});
  if(!phEl)phEl=el('div','colph');
  if(after)board.insertBefore(phEl,after);else board.insertBefore(phEl,board.querySelector('.newcol'));
};
board.ondrop=e=>{
  if(!drag||drag.t!=='col'||!phEl)return;
  e.preventDefault();
  const idx=[...board.children].filter(c=>c.classList.contains('col')&&!c.classList.contains('dragging')&&c.compareDocumentPosition(phEl)&Node.DOCUMENT_POSITION_FOLLOWING).length;
  const i=cols.findIndex(c=>c.id===drag.id);
  const [m]=cols.splice(i,1);cols.splice(idx,0,m);save();
  drag=null;clearPh();render();
};

function render(){
  board.innerHTML='';
  cols.forEach(c=>board.append(colEl(c)));
  const nc=el('div','newcol');
  if(cols.length<8){
    const inp=el('input');inp.placeholder='+ Adicionar coluna';
    inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()&&cols.length<8){cols.push({id:uid(),title:inp.value.trim(),cards:[]});save();render()}};
    nc.append(inp,el('div','sub','  '+cols.length+'/8 colunas'));
  }else nc.append(el('div','sub','Limite de 8 colunas atingido (8/8)'));
  board.append(nc);
}
renderBar();render();

const DK='kanban-disc-v1';let INTV=[1,15,30,45];
const lbl=n=>n===1?'24h':n+' dias';

function startT(d){
  if(D.run&&D.run.id!==d.id)saveT();
  if(D.run&&D.run.id===d.id){if(!D.run.start)D.run.start=Date.now()}
  else D.run={id:d.id,start:Date.now(),acc:0,day:iso(new Date())};
  dsave();
}
function tstats(d){
  const l=logOf(d),T=iso(new Date()),r=runSec(d),lim=addD(T,-7);
  let tot=r,wk=r,td=r;
  for(const k in l){tot+=l[k];if(k===T)td+=l[k];if(k>lim)wk+=l[k]}
  return{tot,wk,td};
}

    const t=rb.querySelector('#rpct');if(t)t.textContent=Math.round(dn/(tot*60)*100)+'% concluído';
  };
  up();cycUp.push(up);return rb;
}
function renderCyc(){
  const root=document.getElementById('cyc');root.innerHTML='';cycUp=[];
  const{c,fl,cur}=cycState();cycSig=cur+'|'+fl.join();
  const cb=el('div','dchips');
  D.cycles.forEach(k=>{
    const b=el('button','chip'+(k===c?' on':''),k.name);
    b.title=k===c?'Clique para renomear':'Abrir ciclo';
    b.onclick=()=>{
      if(k!==c){D.csel=k.id;dsave();renderCyc();return}
      const i=el('input');i.value=k.name;b.replaceWith(i);i.focus();i.select();
      i.onblur=()=>{if(i.value.trim())k.name=titleCase(i.value);dsave();renderCyc()};
      i.onkeydown=e=>{if(e.key==='Enter')i.blur()};
    };
    cb.append(b);
  });
  const nc=el('input');nc.placeholder='+ Novo ciclo';
  nc.onkeydown=e=>{if(e.key==='Enter'){const k={id:uid(),name:titleCase(nc.value)||'Ciclo '+(D.cycles.length+1),items:[],base:{},n:0};D.cycles.push(k);D.csel=k.id;dsave();renderCyc()}};
  cb.append(nc);
  if(D.cycles.length>1){const dx=el('button','x','Excluir ciclo');dx.onclick=()=>ask(dx,()=>{D.cycles=D.cycles.filter(k=>k!==c);D.csel=D.cycles[0].id;dsave();renderCyc()});cb.append(dx)}
  root.append(cb);
  const total=c.items.reduce((a,it)=>a+it.min*60,0);
  const top=el('div','tm'),ti=el('div','tmi'),pc=el('div','tmd'),ps=el('div','sub');
  ti.append(el('small',null,'🔄 Ciclo de estudos · ciclos concluídos: '+c.n),pc,ps);
  const upTop=()=>{let a=0;c.items.forEach(it=>a+=Math.min(cDone(c,it),it.min*60));pc.textContent=(total?Math.round(a/total*100):0)+'%';ps.textContent=fmtH(a)+' de '+fmtH(total)+' no ciclo atual'};
  upTop();cycUp.push(upTop);top.append(ti);
  if(c.items.length&&cur===-1){
    const b=el('button','tmb','🎉 Iniciar novo ciclo');b.onclick=()=>{cycReset(c,true);renderCyc()};top.append(b);
  }else if(c.items.length){
    const b=el('button','tmb s','↻ Reiniciar');b.style.background='var(--mut)';
    b.onclick=()=>ask(b,()=>{cycReset(c,false);renderCyc()});top.append(b);
  }
  root.append(top);root.append(cycRing(c,cur));
  if(c.items.length){
    const ov=el('div','ovb');
    const segs=c.items.map(it=>{const d=D.list.find(x=>x.id===it.id),s=el('div','ovs'),f=el('div','ovf');s.style.flex=it.min;s.title=d.name+' · '+it.min+' min';s.append(f,el('span',null,d.name));ov.append(s);return f});
    const upOv=()=>c.items.forEach((it,i)=>{segs[i].style.width=Math.min(100,cDone(c,it)/(it.min*60)*100)+'%'});
    upOv();cycUp.push(upOv);
  }

  const blk=el('div','blk');blk.append(el('h3',null,'Ordem do ciclo'));
  if(!c.items.length)blk.append(el('div','sub','Adicione disciplinas e defina quantos minutos estudar em cada uma. Estude na ordem; ao completar todas, o ciclo termina e você inicia o próximo.'));
  const track=el('div','car');
  track.ondragover=e=>{if(cdrag===null)return;const b=track.getBoundingClientRect();if(e.clientX<b.left+60)track.scrollLeft-=18;else if(e.clientX>b.right-60)track.scrollLeft+=18};
  c.items.forEach((it,i)=>{
    const d=D.list.find(x=>x.id===it.id),r=el('div','cyr'+(i===cur?' cur':'')+(fl[i]?' dn':'')),l=el('div','cyl');
    l.append(el('div','cyn',(fl[i]?'✓ ':i===cur?'▶ ':(i+1)+'. ')+d.name));
    const tr=el('div','tr'),f=el('div','fl');tr.append(f);const tx=el('div','sub');l.append(tr,tx);
    const up=()=>{const s=cDone(c,it),g=it.min*60;f.style.width=Math.min(100,s/g*100)+'%';tx.textContent=fmtH(Math.min(s,g))+' / '+fmtH(g)+(s>g?'  (+'+fmtH(s-g)+' extra)':'')};
    up();cycUp.push(up);
    const a=el('div','cya'),run=D.run&&D.run.id===d.id&&D.run.start;
    const pb=el('button','tmb s'+(run?' on':''),run?'⏸':'▶');pb.title=run?'Pausar':'Estudar agora';
    pb.onclick=()=>{if(run)pauseT();else startT(d);renderCyc()};
    const mi=el('input');mi.type='number';mi.min='1';mi.value=it.min;mi.title='Meta em minutos';
    mi.onchange=()=>{it.min=Math.max(1,Math.round(Number(mi.value))||1);dsave();renderCyc()};
    const bu=el('button','x','‹'),bd=el('button','x','›'),bx=el('button','x','×');bu.title='Mover para antes';bd.title='Mover para depois';bx.title='Remover do ciclo';
    bu.onclick=()=>{if(i>0){[c.items[i-1],c.items[i]]=[c.items[i],c.items[i-1]];dsave();renderCyc()}};
    bd.onclick=()=>{if(i<c.items.length-1){[c.items[i+1],c.items[i]]=[c.items[i],c.items[i+1]];dsave();renderCyc()}};
    bx.onclick=()=>{c.items.splice(i,1);delete c.base[it.id];dsave();renderCyc()};
    a.append(pb,mi,el('span','sub','min'),bu,bd,bx);
    const hd=el('div','cyh','⠿ Arraste para reordenar');hd.draggable=true;
    hd.ondragstart=e=>{cdrag=i;track.style.scrollSnapType='none';e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.setDragImage(r,20,20);setTimeout(()=>{r.style.opacity='.4'},0)};
    hd.ondragend=()=>{cdrag=null;r.style.opacity='';track.style.scrollSnapType=''};
    r.ondragover=e=>{if(cdrag===null)return;e.preventDefault();r.classList.add('dov')};
    r.ondragleave=()=>r.classList.remove('dov');
    r.ondrop=e=>{e.preventDefault();r.classList.remove('dov');if(cdrag===null||cdrag===i)return;const[m]=c.items.splice(cdrag,1);c.items.splice(i,0,m);cdrag=null;dsave();renderCyc()};
    r.append(hd,l,a);track.append(r);
  });
  if(c.items.length){
    const wrap=el('div','carw'),pv=el('button','carb','‹'),nx=el('button','carb','›');
    pv.onclick=()=>track.scrollBy({left:-270,behavior:'smooth'});
    nx.onclick=()=>track.scrollBy({left:270,behavior:'smooth'});
    wrap.append(pv,track,nx);blk.append(wrap);
    requestAnimationFrame(()=>{const cu=track.children[cur>=0?cur:0];if(cu)track.scrollLeft=cu.offsetLeft-track.offsetLeft-(track.clientWidth-cu.offsetWidth)/2});
  }
  const avl=D.list.filter(d=>!c.items.some(it=>it.id===d.id));
  const pk=el('div','dchips');pk.style.marginTop='12px';pk.style.marginBottom='0';
  pk.append(el('span','sub',avl.length?'Disciplinas cadastradas — clique para escolher:':'Todas as disciplinas cadastradas já estão no ciclo. Digite um nome abaixo para criar outra.'));
  const pchips=avl.map(d=>{const b=el('button','chip',d.name);b.onclick=()=>{nm.value=d.name;pchips.forEach(x=>x.classList.toggle('on',x===b))};pk.append(b);return b});
  blk.append(pk);
  const f=el('div','cyadd'),dl=el('datalist');dl.id='cycdl';
  D.list.filter(d=>!c.items.some(it=>it.id===d.id)).forEach(d=>{const o=el('option');o.value=d.name;dl.append(o)});
  const nm=el('input');nm.type='text';nm.setAttribute('list','cycdl');nm.placeholder='Disciplina (nova ou existente)';nm.style.width='230px';
  const hh=el('input');hh.type='number';hh.min='0';hh.value='1';
  const mm=el('input');mm.type='number';mm.min='0';mm.max='59';mm.value='0';
  const ab=el('button','tmb s','+ Adicionar ao ciclo');
  const addIt=()=>{
    const name=titleCase(nm.value);if(!name)return;
    let d=D.list.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!d){d={id:uid(),name,topics:[]};D.list.push(d)}
    if(c.items.some(it=>it.id===d.id)){nm.value='';return}
    const m=Math.max(1,Math.round((Number(hh.value)||0)*60+(Number(mm.value)||0)));
    c.items.push({id:d.id,min:m});c.base[d.id]=tstats(d).tot;dsave();renderCyc();
  };
  nm.oninput=()=>pchips.forEach(x=>x.classList.remove('on'));
  nm.onblur=()=>{if(nm.value.trim())nm.value=titleCase(nm.value)};ab.onclick=addIt;nm.onkeydown=e=>{if(e.key==='Enter')addIt()};
  f.append(nm,dl,hh,el('span','sub','h'),mm,el('span','sub','min'),ab);blk.append(f);
  root.append(blk);
}

/* ===== Comparar ===== */
let cmpP='all';
function secIn(d,p){
  const l=logOf(d),T=iso(new Date());
  const lim=p==='d'?addD(T,-1):p==='7'?addD(T,-7):p==='30'?addD(T,-30):'';
  let s=runSec(d);
  for(const k in l){if(p==='all'||k>lim)s+=l[k]}
  return s;
}
function renderCmp(){
  const root=document.getElementById('cmp');root.innerHTML='';
  const P=[['d','Hoje'],['7','7 dias'],['30','30 dias'],['all','Total']];
  const bar=el('div','dchips');
  P.forEach(([k,n])=>{const c=el('button','chip'+(k===cmpP?' on':''),n);c.onclick=()=>{cmpP=k;renderCmp()};bar.append(c)});
  
  const rows=D.list.map(d=>({d,s:secIn(d,cmpP)})).sort((a,b)=>b.s-a.s);
  const tot=rows.reduce((a,r)=>a+r.s,0),max=Math.max(...rows.map(r=>r.s),1);
  const nm=P.find(p=>p[0]===cmpP)[1];

  const sum=el('div','cmpsum');
  const card=(t,v)=>{const c=el('div','sm');c.append(el('small',null,t),el('div',null,v));sum.append(c)};
  card('Tempo total ('+nm+')',fmtH(tot));
  card('Mais estudada',rows[0]&&rows[0].s>0?rows[0].d.name:'—');
  card('Menos estudada',rows.length>1?rows[rows.length-1].d.name+' ('+fmtH(rows[rows.length-1].s)+')':'—');
  card('Disciplinas',String(rows.length));
  

  const b1=el('div','blk');b1.style.marginBottom='14px';
  b1.append(el('h3',null,'⏱ Tempo estudado por disciplina'));
  rows.forEach((r,i)=>{
    const row=el('div','br'),tr=el('div','tr'),fl=el('div','fl');
    fl.style.width=(r.s/max*100)+'%';fl.style.background='hsl('+(i*47+215)+' 65% 55%)';tr.append(fl);
    const pct=tot?Math.round(r.s/tot*100):0;
    const n=el('span','n',r.d.name);n.title=r.d.name;
    row.append(n,tr,el('span','v',fmtS(r.s)));b1.append(row);
  });
  root.append(b1);

  const b2=el('div','blk');b2.append(el('h3',null,'📊 Resumo geral'));
  const tw=el('div','tw'),tb=el('table','ct');
  const tr=(cells,tag)=>{const r=el('tr');cells.forEach(c=>r.append(el(tag,null,c)));return r};
  tb.append(tr(['Disciplina','Hoje','7 dias','30 dias','Total','Assuntos estudados','Questões feitas','Revisões feitas'],'th'));
  rows.forEach(r=>{
    const d=r.d,n=d.topics.length,st=d.topics.filter(t=>t.studied).length,q=d.topics.filter(t=>t.q).length;
    const rv=d.topics.reduce((a,t)=>a+Object.values(t.r||{}).filter(Boolean).length,0);
    tb.append(tr([d.name,fmtH(secIn(d,'d')),fmtH(secIn(d,'7')),fmtH(secIn(d,'30')),fmtH(secIn(d,'all')),st+'/'+n,q+'/'+n,rv+'/'+(st*5)],'td'));
  });
  
}

const discEl=document.getElementById('disc'),cmpEl=document.getElementById('cmp'),tq=document.getElementById('tq'),td=document.getElementById('td'),tc=document.getElementById('tc'),cycEl=document.getElementById('cyc'),tcy=document.getElementById('tcy'),homeEl=document.getElementById('home'),thm=document.getElementById('thm');
function tab(n){if(innerWidth<1000)document.body.classList.remove('nav-open');
  board.style.display=n==='q'?'':'none';bbar.style.display=n==='q'?'':'none';discEl.style.display=n==='d'?'block':'none';cmpEl.style.display=n==='c'?'block':'none';cycEl.style.display=n==='y'?'block':'none';homeEl.style.display=n==='h'?'block':'none';
  tq.classList.toggle('on',n==='q');td.classList.toggle('on',n==='d');tc.classList.toggle('on',n==='c');tcy.classList.toggle('on',n==='y');thm.classList.toggle('on',n==='h');
  if(n==='y')renderCyc();if(n==='h')renderHome();
  if(n==='c')renderCmp();
  if(n==='d')renderDisc();
}
const THK='kanban-theme';
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTh(t){

  b.textContent=isDark()?'☀️':'🌙';
  b.title=isDark()?'Mudar para tema claro':'Mudar para tema escuro';
}
try{applyTh(localStorage.getItem(THK))}catch(e){applyTh(null)}
document.getElementById('th').onclick=()=>{const t=isDark()?'light':'dark';applyTh(t);try{localStorage.setItem(THK,t)}catch(e){}};
tq.onclick=()=>tab('q');td.onclick=()=>tab('d');tc.onclick=()=>tab('c');tcy.onclick=()=>tab('y');thm.onclick=()=>tab('h');
setInterval(()=>{if(foc.open&&focUp)focUp();if(homeEl.style.display==='block'&&D.run&&D.run.start&&document.activeElement.tagName!=='INPUT')renderHome();if(discEl.style.display==='block')updTm();if(cmpEl.style.display==='block'&&D.run&&D.run.start)renderCmp()},1000);
try{if(innerWidth>=1000&&localStorage.getItem('kanban-nav')!=='0')document.body.classList.add('nav-open')}catch(e){}
document.getElementById('burger').onclick=()=>{const o=document.body.classList.toggle('nav-open');if(innerWidth>=1000)try{localStorage.setItem('kanban-nav',o?'1':'0')}catch(e){}};
document.getElementById('navbk').onclick=()=>document.body.classList.remove('nav-open');
tab('h');
renderRem();setInterval(renderRem,60000);
setInterval(()=>{if(cycEl.style.display!=='block')return;const s=cycState(),sig=s.cur+'|'+s.fl.join();if(sig!==cycSig)renderCyc();else cycUp.forEach(f=>f())},1000);

/* ===== Firebase: login Google + sincronização ===== */
const useFB=typeof firebase!=='undefined'&&FB_CFG.apiKey&&!/^COLE/.test(FB_CFG.apiKey);
const DEV=Math.random().toString(36).slice(2);
let fbRef=null,pt=null,applying=false,fbUnsub=null;
const synEl=document.getElementById('syn');
const setSyn=t=>{synEl.textContent=t};
const payload=()=>({boards:JSON.stringify(BR),disc:JSON.stringify(D),t:Date.now(),dev:DEV});
function push(){
  if(!fbRef||applying)return;
  setSyn('☁ salvando…');
  clearTimeout(pt);
  pt=setTimeout(()=>{pt=null;fbRef.set(payload()).then(()=>setSyn('☁ sincronizado')).catch(()=>setSyn('⚠ erro ao salvar'))},600);
}
addEventListener('pagehide',()=>{if(fbRef&&pt){clearTimeout(pt);pt=null;fbRef.set(payload())}});
function applyRemote(d){
  applying=true;
  try{
    const b=JSON.parse(d.boards),x=JSON.parse(d.disc);
    if(b&&b.list&&b.list.length)BR=b;
    if(x&&(x.eds||(x.list&&x.list.length)))D=x;
    D.list.forEach(d=>d.topics.forEach(t=>{t.name=String(t.name).toUpperCase()}));normD();
    if(!BR.list.some(k=>k.id===BR.sel))BR.sel=BR.list[0].id;
    if(!D.list.some(k=>k.id===D.sel))D.sel=D.list[0].id;
    cols=curB().cols;
    try{localStorage.setItem(KEY,JSON.stringify(BR));localStorage.setItem(DK,JSON.stringify(D))}catch(e){}
    renderBar();render();renderRem();
    if(discEl.style.display==='block')renderDisc();
    if(cmpEl.style.display==='block')renderCmp();
    if(cycEl.style.display==='block')renderCyc();
    if(homeEl.style.display==='block')renderHome();
  }catch(e){}
  applying=false;
}
if(useFB){
  firebase.initializeApp(FB_CFG);
  const auth=firebase.auth(),db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const lg=document.getElementById('login'),err=document.getElementById('lerr'),lbtn=document.getElementById('lbtn'),lmsg=document.getElementById('lmsg'),usr=document.getElementById('usr');
  lg.style.display='flex';
  lbtn.onclick=()=>{
    err.textContent='';
    const p=new firebase.auth.GoogleAuthProvider();
    const sameDom=location.hostname===FB_CFG.authDomain;
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(sameDom&&(ios||sa)){auth.signInWithRedirect(p);return}
    if(ios&&!sameDom)err.textContent='No iPhone, se o login não abrir, use o endereço https://concurso-1fe2d.firebaseapp.com no Safari.';
    auth.signInWithPopup(p).catch(e=>{
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))auth.signInWithRedirect(p);
      else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')err.textContent='Falha no login: '+e.code;
    });
  };
  auth.getRedirectResult().catch(e=>{err.textContent='Falha no login: '+e.code});
  document.getElementById('lout').onclick=()=>auth.signOut().then(()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(DK)}catch(e){}location.reload()});
  auth.onAuthStateChanged(u=>{
    if(fbUnsub){fbUnsub();fbUnsub=null}
    fbRef=null;
    if(!u){
      usr.style.display='none';lg.style.display='flex';
      lmsg.textContent='Entre com sua conta Google para sincronizar seus dados em todos os aparelhos.';lbtn.style.display='';
      return;
    }
    lg.style.display='none';usr.style.display='flex';
    const ph=document.getElementById('uph');ph.src=u.photoURL||'';ph.style.display=u.photoURL?'':'none';
    document.getElementById('unm').textContent=u.displayName||u.email||'';
    fbRef=db.collection('users').doc(u.uid);
    let first=true;
    fbUnsub=fbRef.onSnapshot(snap=>{
      if(!snap.exists){push();return}
      const d=snap.data();
      if(first||d.dev!==DEV){
        if(first){try{if(!localStorage.getItem('kanban-local-backup'))localStorage.setItem('kanban-local-backup',JSON.stringify({BR,D}))}catch(e){}}
        applyRemote(d);
      }
      first=false;setSyn('☁ sincronizado');
    },()=>setSyn('⚠ sem conexão'));
  });
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
